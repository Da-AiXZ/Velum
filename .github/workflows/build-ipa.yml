name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Velum for iOS
    runs-on: macos-26
    timeout-minutes: 90

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install build tools
        run: |
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          meson --version
          ninja --version

      - name: Build unsigned app
        run: |
          set -o pipefail
          DERIVED_DATA="$RUNNER_TEMP/VelumDerivedData"
          xcodebuild \
            -project Velum.xcodeproj \
            -scheme Velum \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | tee "$RUNNER_TEMP/Velum-xcodebuild.log"

      - name: Package IPA
        run: |
          DERIVED_DATA="$RUNNER_TEMP/VelumDerivedData"
          PACKAGE_DIR="$RUNNER_TEMP/VelumPackage"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Velum.app"
          test -d "$APP_PATH"

          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/Velum.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry Velum-unsigned.ipa Payload
          shasum -a 256 Velum-unsigned.ipa > Velum-unsigned.ipa.sha256

          test -s Velum-unsigned.ipa
          /usr/bin/unzip -t Velum-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Velum-unsigned-ipa
          path: |
            ${{ runner.temp }}/VelumPackage/Velum-unsigned.ipa
            ${{ runner.temp }}/VelumPackage/Velum-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Velum-build-log
          path: ${{ runner.temp }}/Velum-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
